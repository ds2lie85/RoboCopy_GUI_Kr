stages:
  - verify

windows-build-test:
  stage: verify
  tags:
    - saas-windows-medium-amd64
  timeout: 30m
  variables:
    DOTNET_NOLOGO: '1'
    DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: '0'
  before_script:
    - $env:DOTNET_CLI_HOME = Join-Path $PWD '.dotnet_cli'
    - $sdkVersion = (Get-Content -LiteralPath global.json -Raw | ConvertFrom-Json).sdk.version
    - .\Setup-LocalSdk.ps1 -SdkVersion $sdkVersion
  script:
    - .\.dotnet\dotnet.exe restore RoboCopy_GUI_Kr.sln --configfile NuGet.Config
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - .\.dotnet\dotnet.exe build RoboCopy_GUI_Kr.sln -c Release --no-restore
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - .\.dotnet\dotnet.exe test RoboCopy_GUI_Kr.sln -c Release --no-build --no-restore --logger trx --results-directory TestResults
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - TestResults/*.trx
